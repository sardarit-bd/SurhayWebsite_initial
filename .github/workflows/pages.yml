# Baut die Website und veroeffentlicht sie auf GitHub Pages.
#
# Ersetzt den Standard-Jekyll-Build von GitHub: Jekyll wuerde ueber die
# Quelldateien stolpern. Deshalb baut dieser Workflow selbst und laedt nur das
# fertige Artefakt hoch.
#
# Seit der Migration von Astro auf Next.js heisst das Artefakt out/ statt
# dist/ (statischer Export). Alles andere bleibt: dieselben zwei
# Umgebungsvariablen aus configure-pages, dasselbe Entfernen der
# Apache-Dateien, dasselbe upload-pages-artifact.
#
# Voraussetzung (einmalig): Settings → Pages → "Build and deployment" →
# Source auf "GitHub Actions" stellen.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deploys nicht abbrechen, aber nur einen gleichzeitig zulassen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # base_path/origin kommen aus configure-pages, damit Links und
        # Assets im Unterordner /SurhayWebsite/ korrekt aufgeloest werden
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Beides gehoert zum Hostinger-Ziel und ist auf GitHub Pages nicht nur
      # wirkungslos, sondern schaedlich:
      #   contact.php  — Pages fuehrt kein PHP aus und liefert die Datei als
      #                  lesbaren Quelltext aus (Content-Type
      #                  application/x-httpd-php, HTTP 200). Damit stehen
      #                  Empfaengeradresse und Pruflogik oeffentlich im Netz,
      #                  ohne dass das Formular je funktionieren wuerde.
      #   .htaccess    — Apache-Konfiguration; Pages ignoriert sie und liefert
      #                  sie ebenfalls als Datei aus.
      # Auf dem FTP-Weg nach Hostinger (deploy.yml) bleiben beide erhalten.
      - name: Nur-Apache-Dateien aus dem Artefakt entfernen
        run: rm -f out/contact.php out/.htaccess

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
